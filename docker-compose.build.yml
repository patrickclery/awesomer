# One-shot containerized build of web/out (no deploy, D-08).
#
#   mkdir -p .awesomer-build/staging
#   docker compose -f docker-compose.build.yml run --rm --build builder
#
# The container writes the export to the host staging directory
# .awesomer-build/staging, never to web/out. docker/build.sh renames staging
# into web/out after the run exits 0, so a failed or interrupted copy leaves
# web/out as it was (D-07). A raw `compose run` only fills staging.
#
# The staging directory must exist before the run: the bind uses
# create_host_path: false so Docker never creates it as root.
#
# `name:` is load-bearing: this directory is named awesomer, the same as the
# live Postgres compose project in /opt/awesomer. Without it compose would adopt
# awesomer-postgres as its own container (RESEARCH Pitfall 1).
#
# Never run `config` on this file without --no-env-resolution: plain `config`
# prints the env file's secrets. No ports are published; the in-container API
# listens on 127.0.0.1:4000 only, so it is reachable only inside the container,
# not from other containers on awesomer_default.
name: awesomer-build

services:
  builder:
    build:
      context: .
      dockerfile: docker/build.Dockerfile
    image: awesomer-build:local
    user: "1000:1000"
    init: true
    env_file:
      # Same file the nightly's EnvironmentFile loads (DATABASE_URL, Umami vars).
      # The entrypoint drops every variable the build does not read; the two
      # known write-capable secrets are also blanked below so they never
      # enter the container at all.
      - path: api/.env
        required: true
    environment:
      ADMIN_API_KEY: ""
      GITHUB_API_KEY: ""
      BASE_PATH: /awesomer
      PORT: "4000"
      DATABASE_HOST_OVERRIDE: awesomer-postgres
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - type: bind
        source: ./.awesomer-build/staging
        target: /output
        bind:
          create_host_path: false
    networks: [awesomer-db]

networks:
  awesomer-db:
    external: true
    name: awesomer_default
